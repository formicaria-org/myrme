# The study assistant, as a DETERMINISTIC orchestrator (see src/lib.rs). Pure Rust, no model and no
# network: the two model touch-points and the web sit behind trait seams, so this crate builds and
# tests in the default `pixi run ci` with zero heavy deps. The real seams (a local llama.cpp step, a
# text-only web search) are implemented elsewhere, behind the `agent` runtime — this crate holds only
# the control logic, which is the whole point: the agent is the orchestrator, not the model.
[package]
name = "fm-agent"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# For the `openai` LlmStep only — a hand-rolled localhost HTTP client over `std::net` (no HTTP
# framework, no TLS), the same minimal-dependency stance as fm-serve's hand-rolled server. The
# orchestrator itself stays pure; this is just how the concrete model-server seam frames its JSON.
serde_json = "1"

# Unix only, and used only by the launcher: a single `prctl(PR_SET_PDEATHSIG)` so a spawned model
# server dies with its supervisor (see launch.rs). No other libc use — the orchestrator stays pure.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
