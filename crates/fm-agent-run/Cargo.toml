# The out-of-process study-assistant RUNNER — how a user invokes the agent. It depends only on
# fm-agent (the pure deterministic pipeline); all vault I/O goes through a running fm-serve over the
# VaultAccess seam, so it drags in NO fm-core (no git, no FileStore, no SQLite) and no heavy/model
# deps — which is exactly what lets the same runner target Android. NOTHING depends on it, so the core
# app still never knows the agent exists.
[package]
name = "fm-agent-run"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "fm-agent-run"
path = "src/main.rs"

[[bin]]
name = "agent-chat"
path = "src/chat.rs"

[[bin]]
name = "agent-serve"
path = "src/serve.rs"

# The in-app model **downloader** (resumable + checksum). A phone has no `curl` to fetch the GGUF on
# first enable, and the desktop's `fetch.sh` is a shell script — this feature is the Rust equivalent
# both can call. Off by default so a build running an already-provisioned model stays lean; the mobile
# `agent` feature turns it on. `ureq` is a small blocking HTTPS client whose default `rustls` TLS is
# pure-Rust (bundled Mozilla roots via webpki-roots), so it needs no system TLS and cross-compiles to
# Android; `sha2` verifies the download. Both are **agent-only** deps — the notes core links neither
# (the owner's ruling: the core stays minimal, an agent may carry its own heavier deps).
#
# `flate2` + `tar` arrived with the desktop runtime fetch (2026-09-02): the prebuilt llama.cpp and
# whisper.cpp servers are published as `.tar.gz`, and until then the only extractor in this project
# was the `tar` binary shelled out from `agents/fetch.sh` — which Windows may not have and which is
# the shell dependency the desktop launch path exists to remove. Both are MIT/Apache-2.0 pure Rust.
# `zip` joined them when Windows was pinned: llama.cpp publishes `.tar.gz` for Linux and macOS but
# `.zip` for Windows, so the extractor has to read both. Default features off — the archives use
# plain deflate, and the optional codecs (zstd, bzip2, aes) would each add a C dependency for a
# format we never receive.
[features]
download = ["dep:fm-fetch", "dep:ureq", "dep:sha2", "dep:flate2", "dep:tar", "dep:zip"]

[dependencies]
fm-agent = { path = "../fm-agent" }
clap = { workspace = true }
serde_json = "1"
# The download engine itself, since 2026-09-10. See `fm-fetch`'s header for why it moved out.
fm-fetch = { path = "../fm-fetch", optional = true }
ureq = { version = "2", optional = true }
sha2 = { version = "0.11", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
