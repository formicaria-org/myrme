# The out-of-process study-assistant RUNNER — how a user invokes the agent. It depends only on
# fm-agent (the pure deterministic pipeline); all vault I/O goes through a running fm-serve over the
# VaultAccess seam, so it drags in NO fm-core (no git, no FileStore, no SQLite) and no heavy/model
# deps — which is exactly what lets the same runner target Android. NOTHING depends on it, so the core
# app still never knows the agent exists.
[package]
name = "fm-agent-run"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "fm-agent-run"
path = "src/main.rs"

[[bin]]
name = "agent-chat"
path = "src/chat.rs"

[[bin]]
name = "agent-serve"
path = "src/serve.rs"

[dependencies]
fm-agent = { path = "../fm-agent" }
clap = { workspace = true }
serde_json = "1"
