# Each model: `name` (the key you pass to fetch), its Hugging Face `repo` and `file`, and a note.
# Keep `name`, then `repo`, then `file` in that order — fetch.sh reads them positionally.
#
# `revision` + `sha256` (2026-08-29): the exact Hugging Face commit, and the SHA-256 of the file at
# that commit. **They only work as a pair.** A checksum against `resolve/main` is a moving target: the
# day a repo re-quantises, every download starts failing verification — permanently, on every device
# already shipped, with nothing the user can do. Pinned to a commit, the URL names the same bytes
# forever, so a mismatch can only mean a corrupt transfer, which is what a checksum is for.
#
# Until these existed the downloader's verification branches were dead code, and a body that closed
# early was renamed as complete and returned forever — the only self-heal was uninstalling the app,
# which also destroys the vault.
#
# Provenance: taken from the Hugging Face API (`?blobs=true` → `siblings[].lfs.sha256`), and the three
# files present in this checkout were re-hashed locally and match — so these pin the bytes that were
# actually benchmarked, not a number taken on trust.

# `license` and `bytes` are here because the app has to *show* them before it spends someone's
# disk and bandwidth: the first-enable screen names what it is about to download, how large it is,
# and under what terms. Both were previously prose inside `note`, which no parser can read.
# `bytes` is the download size (the local file, re-hashed above); `mmproj_bytes` is the extra
# projector that makes image-reading work, charged separately because it is a separate choice.
[[models]]
name = "qwen3-vl-4b"
license = "Apache-2.0"
bytes = 2497281664
mmproj_bytes = 836180256
repo = "Qwen/Qwen3-VL-4B-Instruct-GGUF"
file = "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
revision = "1cd86afb9a95c410a6038ab3b40d8b578c892266"
sha256 = "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a"
# The multimodal projector — what turns this from a text model into the vision model it already is.
# Optional and additive: without it the same GGUF serves text-only, exactly as it has until now, and
# `/describe` says so instead of describing an image it never saw. Fetched beside the weights from
# the same pinned commit. Apache-2.0, like the model.
mmproj = "mmproj-Qwen3VL-4B-Instruct-F16.gguf"
# **8192, and the projector off the GPU — the two go together** (measured 2026-10-09 on the 4 GB RTX
# 3050). With the projector on the card, nothing above 2048 starts (out of device memory). Off the
# card, 8192 starts at 3626 MiB and answered a 6.8k-token email exchange in 14.5 s at 3641 MiB. Why
# 8192: the meeting pass reads a whole email conversation in one prompt, and 2048 holds ~700 words.
# Cost on a machine with no GPU: ~0.9 GB more RAM for the larger KV cache.
ctx = 8192
mmproj_offload = false
# A full-size phone photograph becomes at most this many tokens: uncapped, every handwritten page
# in the eval took over the 120 s reading limit with the projector on the CPU; at 1024, ~27 s and ~18%
# word error (2026-10-18, methods/image-text/eval).
image_max_tokens = 1024
# Fit to read a packet's nutrition label (measured 2026-10-13, nine photographs from Open Food
# Facts at 1024 pixels: 48 figures right, none wrong, 8 left empty; `agents/bench/results.md`).
# A model without this line is never handed a label: `lfm2.5-vl-450m` got 2 packets of 9 right.
reads_labels = true
# The mail pass's two questions share one system prompt, so the title call reuses the meetings call's
# cached emails (516 tokens read instead of 4,041 on a ~4000-token exchange). Measured 2026-10-19:
# 16/17 meetings and 12/12 titles, against 15/17 and 12/12 apart. Not for the small models, which
# then name the mailbox's owner (speed study §2.7).
shared_mail_prompt = true
note = "LAPTOP pick (2026-07-24) — measured on our case: 40.1 t/s on the RTX 3050 (Vulkan, 2.78 GB VRAM), 3/3 verbatim grounding (best of the sweep), abstains on junk sources. Served text-only via /v1/chat/completions (mmproj-Qwen3VL-4B-Instruct-F16.gguf only needed if we later add image-notes). Caveat: less eager to *initiate* a search — fine while /research is deterministically routed. Apache-2.0."

