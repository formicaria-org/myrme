# The agent's local model catalogue and runtime — the single place that says *which* model to fetch
# and run. `fetch.sh` (or `pixi run fetch-model [name]`) reads this, downloads the runtime and the
# chosen model into the gitignored `runtime/` and `models/` folders beside this file, and prints how
# to serve it. Nothing here is huge, secret, or committed: only this manifest travels; the weights
# and the binary stay local. The mobile app embeds this file (include_str!) for its first run.
#
# Design stance (owner, 2026-07-22): **one measured pick per device, nothing else.** Chosen by real
# on-device benchmarks and leaderboard evidence, weighted for instruction-following + tool/search use
# (BFCL × IFEval), explicitly not code. The two devices differ, so the defaults differ.
#
# LAPTOP pick updated 2026-07-24 → **qwen3-vl-4b**, from a hardened-harness sweep of the alternatives
# (docs/context/model-selection-research-2026-07-24-grounded.md § Part 5; raw in agents/bench/results.md):
# same GPU speed as qwen3-4b (40.1 t/s), *best-measured* grounding (3/3 verbatim), and the only fast
# model that abstains on junk sources instead of fabricating. Text-only here (mmproj not fetched); the
# multimodal head is enabled by fetching `mmproj` (below), which `/describe` needs and nothing else
# uses. qwen3-4b-2507 kept below as the validated fallback.
# PHONE pick unchanged: the same sweep found no ≤2B model beats lfm2.5-1.2b (nothing grounds below 4B).

# The default model — the LAPTOP research pick. `default_mobile` overrides it on the phone (a smaller
# model that fits a phone's RAM and stays responsive).
#
# PHONE (2026-10-20, `docs/research/2026-10-20-small-model-benchmark-summary.md`): **qwen3.5-0.8b**,
# the phone's only model. The 450M was faster only: on a user's real mail it found none of four
# meetings, and it read handwriting at 96% WER and typed pages at 49%. One `phone_label` means no
# chooser (formicaria shows one only for two or more). A phone already running a 450M keeps it and is
# offered this default (`installed.rs`, the owner's 2026-10-10 rule).
default = "qwen3-vl-4b"
default_mobile = "qwen3.5-0.8b"

# Prebuilt llama.cpp server, pinned for reproducibility. `runtime_url_<platform>` is the portable
# CPU build; the `_gpu` variant is the Vulkan build that offloads to a discrete GPU (measured: the RTX 3050 runs the
# 4B at ~52 tok/s vs ~14 on CPU, and holds it in VRAM instead of system RAM). fetch.sh picks the GPU
# build when `gpu` != "off" and a Vulkan loader is present — GPU speed with no config, CPU otherwise.
# **Keyed by platform, and every archive carries its checksum.** A model is pinned by a Hugging
# Face commit *and* a hash; a runtime is a URL to an executable, so the hash is the only thing
# between a redirect and running a stranger's binary — `Manifest::parse` therefore drops any
# `runtime_url_*` whose `runtime_sha256_*` is missing rather than fetching it unverified.
#
# **Myrme's own build since 2026-10-18** (release `runtime-llg-3`, `.github/workflows/runtime.yml`):
# llama.cpp b10076 with upstream's flags plus llguidance, the faster engine for answers held to a
# schema — measured 17/17 either way on the meeting eval, ~17% less time on the RTX 3050 (Vulkan)
# and ~20% on the CPU (`docs/context/decisions.md`). Upstream's file names and layout are kept.
#
# The suffix is the platform: `linux_x64`, `macos_arm64`, `windows_x64`, with `_gpu` for the Vulkan
# build that offloads to a discrete GPU. Every archive here was downloaded and hashed; a platform we
# have not verified gets no entry at all rather than one the fetch cannot check.
runtime_url_linux_x64 = "https://github.com/formicaria-org/myrme/releases/download/runtime-llg-3/llama-b10076-bin-ubuntu-x64.tar.gz"
runtime_sha256_linux_x64 = "2d2528b9fed0185aa59d55a82d75d22b6d1d2daf0aaffea8e0f3ec105d8ec574"
runtime_url_linux_x64_gpu = "https://github.com/formicaria-org/myrme/releases/download/runtime-llg-3/llama-b10076-bin-ubuntu-vulkan-x64.tar.gz"
runtime_sha256_linux_x64_gpu = "433fdd77269175a96790a1d68e138c3f1a04eef8b4cd51e135e94f44b08371e5"
# macOS ships a tarball like Linux; Windows ships a `.zip`, which is why the extractor learned a
# second format. Both hashed from the downloaded archive, like the Linux pair above.
runtime_url_macos_arm64 = "https://github.com/formicaria-org/myrme/releases/download/runtime-llg-3/llama-b10076-bin-macos-arm64.tar.gz"
runtime_sha256_macos_arm64 = "908fe439ab1a4760e53fe0fadbff6f215e6147f8dfa3400c4bb36f1e9a0e1373"
runtime_url_windows_x64 = "https://github.com/formicaria-org/myrme/releases/download/runtime-llg-3/llama-b10076-bin-win-cpu-x64.zip"
runtime_sha256_windows_x64 = "f4bbf9422d87e7d44e2bd323138973cb4a68d777a9fee0ff73835c8f7abe55a0"
runtime_url_windows_x64_gpu = "https://github.com/formicaria-org/myrme/releases/download/runtime-llg-3/llama-b10076-bin-win-vulkan-x64.zip"
runtime_sha256_windows_x64_gpu = "0dc68913763167597902f176f06a4c9a35da9c91b9da46c473aea2646b0b18b8"

# Serve settings. `threads` is the laptop value (8 physical cores); `threads_mobile` is the phone's —
# 4 = the Dimensity 7300's big cores, which is *both* fastest and leaves the little cores for the UI
# (measured). Small `ctx` bounds the KV cache. Each [[models]] block may override `ctx`/`threads`.
port = 8081
ctx = 2048
threads = 8
threads_mobile = 4
# The longest reply the agent posts, in characters (a "never berserk" bound + keeps a small model
# concise). Raise it here for longer answers — a formula + explanation needs more than the old 600.
max_reply_chars = 2000

# GPU policy for the desktop runtime: "auto" (a discrete GPU when one is present, else the CPU — an
# integrated GPU is skipped, since the laptop model ran slower on one than on the CPU; 2026-10-23),
# "on" (offload to any GPU, an integrated one included), or "off" (CPU only). Default is "auto".
gpu = "auto"

# --- Audio→transcript runtime (whisper.cpp). ---------------------------------------------------------
# Used by `agent-serve --whisper-port <p>` (enables audio in the /transcribe command). The transcript
# rides the same insertion-only proposal path as /research; the specialist only ever receives audio
# bytes by value, never a blob path (the transcribe safety invariant). The runtime and the weights
# are fetched when Audio transcription is switched on (Linux and Windows; see the `runtime_url_whisper_*`
# keys below), or by `pixi run fetch-whisper` in a checkout. `agent-serve` errors clearly if either is
# missing, so nothing silently half-works.
whisper_model = "ggml-base"
whisper_model_repo = "ggerganov/whisper.cpp"
whisper_model_file = "ggml-base.bin"
# The EVERYDAY whisper pick, on every device (the name is historical: the desktop reads it too, via
# `whisper_desktop`) — a `[[models]]` name fetched on demand when Audio transcription is on.
# tiny.en → base.en (2026-07-24) for accuracy; base.en → **base** (2026-10-18): the same size and
# memory, but it hears any language. base.en wrote "(speaking in foreign language)" for an Italian
# recipe recording; base wrote it down in Italian (decisions.md 2026-10-18, *listening in any language*).
whisper_mobile = "ggml-base"
# The BETTER LISTENING pick a person may choose in Settings on any device: small, ~488 MB, about
# 1.5× slower on the laptop (61 s for a 2-minute recording) and markedly closer to what was said.
whisper_better = "ggml-small"
# whisper.cpp DOES ship a prebuilt, CPU-only, portable Linux x64 server tarball (verified: it unpacks
# `whisper-server` + `libwhisper.so` + `libggml-cpu-*` micro-arch variants, ~24 MB, no CUDA, links only
# stock system libs). So `fetch-whisper` stages it automatically, exactly like the llama.cpp runtime —
# no build-from-source. (The tarball also bundles a `parakeet-cli`, a possible future faster/edge leaf.)
runtime_url_whisper_linux_x64 = "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-ubuntu-x64.tar.gz"
runtime_sha256_whisper_linux_x64 = "f3bf3b4369a99b54665b0f19b88483b30de27f25963b0414235dea03198515c5"
# Windows ships a `.zip` holding `Release/whisper-server.exe` and its DLLs — flattened on extraction
# like every other runtime here. **There is no macOS build upstream at v1.9.1**, which is why macOS
# has no entry: the app then says the runtime does not exist for that platform yet, rather than
# implying something is missing from the machine. Unlike the llama archives this one carries no
# LICENSE file, so whisper.cpp's MIT notice travels via `ci/third-party.sh`'s runtime section only.
runtime_url_whisper_windows_x64 = "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip"
runtime_sha256_whisper_windows_x64 = "7d8be46ecd31828e1eb7a2ecdd0d6b314feafd82163038ab6092594b0a063539"

# --- The phone's runtimes (contract 1.4) -------------------------------------------------------------
# Android carries its runtimes inside the APK and never fetches one (`Manifest::platform_key` answers
# `None` there), so these are read by formicaria's packaging, not by the app: its
# `ci/android-stage-runtime.sh` stages this archive and checks this hash, and
# `ci/android-stage-whisper.sh` compiles whisper.cpp at this tag (upstream publishes no Android
# build). Kept here so the runtime a phone runs is decided in one place, beside the desktop's.
runtime_url_android_arm64 = "https://github.com/formicaria-org/myrme/releases/download/runtime-llg-3/llama-b10081-bin-android-arm64.tar.gz"
runtime_sha256_android_arm64 = "40763a08247ace6866dd478099d2d0aa53f6cd27d2c2fa75371b0aa13bb35200"
whisper_android_source = "v1.9.1"

