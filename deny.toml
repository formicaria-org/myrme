# cargo-deny: the license gate. The stack is deliberately permissive-only; any
# GPL/AGPL/SSPL/BUSL/source-available crate that is *linked* (not shelled out to)
# must fail the build. GPL tools like pdftotext/libvips are invoked as
# subprocesses and never appear in this graph.
#
# ONE named exception, below: libgit2, for any device with NO git binary — the phone, and
# Windows, which ships none (widened 2026-08-28, `decisions.md#git`). The rule above is unchanged and
# still applies to everything else — the exception is scoped to a single crate on purpose,
# rather than widening `allow`, so nothing else can arrive under the same licence unnoticed.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    # webpki-roots ships the Mozilla CA root store (a *data* set, not code) under the Community
    # Data License Agreement — Permissive 2.0, a genuinely permissive licence. It arrives via
    # `ureq`'s rustls TLS, behind the agent-only `fm-agent-run/download` feature (the in-app model
    # fetcher); the notes core never links it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Several allowed licenses aren't used yet but will be as deps grow (notify=CC0,
# kamadak-exif=BSD-2, ...). Don't warn about the allowlist running ahead.
unused-allowed-license = "allow"

# ---------------------------------------------------------------------------------------
# THE ONE LICENCE EXCEPTION: libgit2, on any device with no git binary (owner's ruling,
# 2026-07-19, widened to Windows 2026-08-28 — see `decisions.md#git`).
#
# WHY: a phone has no `git` binary to shell out to — Android ships none, iOS forbids
# executing one — so the subprocess stance that keeps this gate clean on the desktop cannot
# work there. `git2`/libgit2 is the mature option; `gix` push is still unimplemented, and
# hand-writing the push protocol on the corruption-critical path is the larger risk. Behind
# the non-default `fm-core/native-git` feature: the desktop still shells out, unaffected.
#
# WHY IT IS SAFE: libgit2 is GPL-2.0-only *with its own linking exception*, read verbatim
# from the vendored COPYING at the pinned version — "the authors give you unlimited
# permission to link the compiled version of this library into combinations with other
# programs, and to distribute those combinations without any restriction". Linking is
# precisely what the exception exists to permit. What survives is the NOTICE obligation, and
# the duty to publish any modification we make to libgit2 itself. We make none.
#
# **AND HERE IS THE PART TO READ TWICE: cargo-deny CANNOT SEE ANY OF THIS.**
#
# `libgit2-sys` declares `license = "MIT OR Apache-2.0"` — true of its Rust wrapper, silent
# about the ~230k lines of GPL C it vendors. cargo-deny treats a valid `license` field as
# authoritative, so it never reads the licence files, and `[[licenses.clarify]]` never fires
# no matter what path or hash it is given (tested against cargo-deny 0.20.2: a clarify entry
# is silently inert, and a paired `[[licenses.exceptions]]` reports
# `license-exception-not-encountered`). Both were tried here and removed rather than left in
# place looking effective — dead config that appears to enforce something is worse than none.
#
# So `cargo deny` reports `licenses ok` for libgit2 **and always will**, on the metadata
# technicality the 2026-07-18 `git2` rejection named. That means:
#
#   THE ENFORCEMENT LIVES IN ci/checks.sh AND ci/third-party.sh, NOT HERE.
#
# `ci/third-party.sh` carries an override so the shipped notice states libgit2's real
# licence, and `ci/checks.sh` fails if libgit2-sys enters the graph without that override —
# so the dependency cannot arrive without the notice that legally must travel with it.
# If you are adding another dependency that vendors code under a licence it does not
# declare, this gate will not catch it either. Add it there.
# ---------------------------------------------------------------------------------------

[advisories]
version = 2
# No advisory waivers: the Tauri/gtk3 tree that required them was removed with the
# native window. Any real vulnerability, unsound, or unmaintained advisory now
# surfaces on its own; add a documented `ignore` entry only if one reappears.
#
# Myrme waives none. formicaria's four waivers (the YAML parser; three on `zip` 2.4.2) did not
# carry over: Myrme links no YAML parser, and its lockfile resolved `zip` 2.6.1, which none of the
# three advisories match (2026-10-18). A waiver added here names its advisory, its reason and the
# change that will remove it.
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
