# The gate, on Linux: `pixi run ci`, the same command a developer runs locally.
# Public repo, standard runner, so minutes are free; it runs on pushes to main and on pull requests.
name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run ci
      # A release tag must name the version Cargo.toml says, or formicaria would show one version
      # and link another.
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} but Cargo.toml says $v"; exit 1; }
          [ -f "docs/releases/${GITHUB_REF_NAME}.md" ] || { echo "::error::no release notes in docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }
  # Myrme against a real formicaria: fm-serve built from the pinned release, the contract's /api
  # and note conventions exercised end to end (crates/fm-agent-run/tests/integration_fm.rs).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            .fm/* -> target
      - run: pixi run integration
  # **A version is released when its page is published** (decisions.md, 2026-10-19): only after the
  # gate and the integration test pass. On a tag it publishes that tag's page; on `main` it only fills
  # in pages missing for earlier tags (seconds, and nothing to do once they exist).
  # **One run at a time** (2026-10-24): a release pushes `main` and its tag together, and both runs
  # reach this job; run side by side, each created the new tag's page, and the duplicate made every
  # later run fail. Queued, the second finds the page and only checks it.
  release:
    if: github.event_name == 'push'
    needs: [ci, integration]
    concurrency:
      group: release-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags origin
      - run: sh agents/release-pages.sh
        env:
          GH_TOKEN: ${{ github.token }}
