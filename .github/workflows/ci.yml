# The gate, on Linux: `pixi run ci`, the same command a developer runs locally.
# Public repo, standard runner, so minutes are free; it runs on pushes to main and on pull requests.
name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
      - run: pixi run ci
