# The model runtime Myrme ships: llama.cpp's own release archives, rebuilt with **llguidance** — the
# grammar engine that holds an answer to its schema — and published here under upstream's exact
# file names and layout, so the catalogue (agents/models.toml) and formicaria's Android staging
# change only a URL. `docs/context/decisions.md`, 2026-10-18 (*the faster grammar engine on every
# platform*).
#
# Each archive is built with upstream's own flags for that platform (llama.cpp's
# .github/workflows/release.yml at the pinned tag) plus -DLLAMA_LLGUIDANCE=ON. The Vulkan archives
# are composed the way upstream composes its Windows ones: the CPU archive (which carries the server
# and llguidance) plus upstream's unchanged Vulkan backend library from the same tag — under
# GGML_BACKEND_DL a backend is a separate library loaded at run time.
#
# Runs on a `runtime-*` tag or by hand. Each pin is the version the catalogue uses today on that
# platform: b10076 for the desktops, b10081 for Android (formicaria's ci/android-stage-runtime.sh).
name: runtime

on:
  workflow_dispatch:
  push:
    tags: ['runtime-*']

permissions:
  contents: read

env:
  DESKTOP_TAG: b10076
  ANDROID_TAG: b10081
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON -DLLAMA_LLGUIDANCE=ON"

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.DESKTOP_TAG }}
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)
      - name: Check
        run: |
          ./build/bin/llama-server --version
          # A symbol only llguidance defines; the stock archive has none.
          grep -aqr toktrie build/bin || { echo "::error::no llguidance code under build/bin"; exit 1; }
          if grep -aqr "LLAMA_LLGUIDANCE=ON) is not enabled" build/bin; then echo "::error::built without llguidance"; exit 1; fi
      - name: Pack
        run: |
          T=${{ env.DESKTOP_TAG }}
          cp LICENSE ./build/bin/
          tar -czf llama-$T-bin-ubuntu-x64.tar.gz --transform "s,^\.,llama-$T," -C ./build/bin .
          # Vulkan: the same files plus upstream's Vulkan backend from the same tag.
          curl -fsSL -o up.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/$T/llama-$T-bin-ubuntu-vulkan-x64.tar.gz
          mkdir up && tar -xzf up.tar.gz -C up
          cp up/llama-$T/libggml-vulkan.so ./build/bin/
          tar -czf llama-$T-bin-ubuntu-vulkan-x64.tar.gz --transform "s,^\.,llama-$T," -C ./build/bin .
      - uses: actions/upload-artifact@v5
        with:
          name: linux-x64
          path: llama-*.tar.gz

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.DESKTOP_TAG }}
          fetch-depth: 0
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_RPATH='@loader_path' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DLLAMA_BUILD_BORINGSSL=ON \
            -DGGML_METAL_USE_BF16=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(sysctl -n hw.logicalcpu)
      - name: Check
        run: |
          v=$(./build/bin/llama-server --version 2>&1) || echo "::error::llama-server --version failed: $(echo $v | tr '\n' ' ')"
          echo "$v"
          # llguidance's Rust is in the build ("toktrie" is its tokenizer crate), and llama.cpp's
          # "-DLLAMA_LLGUIDANCE=ON) is not enabled" abort, which only a build without it carries, is
          # not. Names that work on every platform: macOS and Windows export no llg_* symbol.
          grep -aqr toktrie build/bin || { echo "::error::no llguidance code under build/bin"; exit 1; }
          if grep -aqr "LLAMA_LLGUIDANCE=ON) is not enabled" build/bin; then echo "::error::built without llguidance"; exit 1; fi
      - name: Pack
        run: |
          T=${{ env.DESKTOP_TAG }}
          cp LICENSE ./build/bin/
          tar -czf llama-$T-bin-macos-arm64.tar.gz -s ",^\.,llama-$T," -C ./build/bin .
      - uses: actions/upload-artifact@v5
        with:
          name: macos-arm64
          path: llama-*.tar.gz

  windows-x64:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.DESKTOP_TAG }}
          fetch-depth: 0
      - run: choco install ninja
      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release
      - name: Check
        shell: bash
        run: |
          v=$(./build/bin/Release/llama-server.exe --version 2>&1) || echo "::error::llama-server --version failed: $(echo $v | tr '\n' ' ')"
          echo "$v"
          grep -aqr toktrie build/bin/Release || { echo "::error::no llguidance code under build/bin/Release"; exit 1; }
          if grep -aqr "LLAMA_LLGUIDANCE=ON) is not enabled" build/bin/Release; then echo "::error::built without llguidance"; exit 1; fi
      - name: Pack
        shell: pwsh
        run: |
          $T = "${{ env.DESKTOP_TAG }}"
          # The OpenMP runtime upstream ships beside the binaries; found rather than hard-coding the
          # MSVC redistributable's version folder.
          $omp = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Redist\MSVC" -Recurse -Filter "libomp140.x86_64.dll" | Where-Object { $_.FullName -match "debug_nonredist\\x64" } | Select-Object -First 1
          if (-not $omp) { throw "libomp140.x86_64.dll not found" }
          Copy-Item $omp.FullName .\build\bin\Release\
          Copy-Item LICENSE .\build\bin\Release\
          7z a -snl "llama-$T-bin-win-cpu-x64.zip" .\build\bin\Release\*
          # Vulkan: the same files plus upstream's Vulkan backend from the same tag (upstream's own
          # composition for its Windows archives).
          curl.exe -fsSL -o up.zip "https://github.com/ggml-org/llama.cpp/releases/download/$T/llama-$T-bin-win-vulkan-x64.zip"
          7z e up.zip ggml-vulkan.dll -r -oup
          Copy-Item .\up\ggml-vulkan.dll .\build\bin\Release\
          7z a -snl "llama-$T-bin-win-vulkan-x64.zip" .\build\bin\Release\*
      - uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: llama-*.zip

  android-arm64:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "29.0.14206865"
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.ANDROID_TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: NDK and the Rust target
        run: |
          # The runner image carries the Android SDK; only the NDK version upstream uses is added.
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          test -f "$NDK/build/cmake/android.toolchain.cmake" || { echo "::error::NDK not installed at $NDK"; exit 1; }
          echo "ANDROID_NDK=$NDK" >> $GITHUB_ENV
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android28-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android28-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> $GITHUB_ENV
          rustup target add aarch64-linux-android
      - name: Point llguidance's cargo build at the phone
        # llama.cpp builds llguidance with a plain `cargo build`, i.e. for the build machine. A cross
        # build needs the target named, and the library is then under target/<triple>/release.
        run: |
          sed -i 's|cargo build --release --package llguidance|cargo build --release --package llguidance --target aarch64-linux-android|' common/CMakeLists.txt
          sed -i 's|${LLGUIDANCE_SRC}/target/release)|${LLGUIDANCE_SRC}/target/aarch64-linux-android/release)|' common/CMakeLists.txt
          grep -n "aarch64-linux-android" common/CMakeLists.txt
      - name: Build
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_INSTALL_RPATH='$ORIGIN' \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_BORINGSSL=ON \
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release -j $(nproc)
      - name: Check
        run: |
          f=$(file build/bin/llama-server); echo "$f"
          case "$f" in *"ARM aarch64"*) ;; *) echo "::error::not an arm64 binary: $f"; exit 1;; esac
          # llguidance's Rust is in the build ("toktrie" is its tokenizer crate), and llama.cpp's
          # "-DLLAMA_LLGUIDANCE=ON) is not enabled" abort, which only a build without it carries, is
          # not. Names that work on every platform: macOS and Windows export no llg_* symbol.
          grep -aqr toktrie build/bin || { echo "::error::no llguidance code under build/bin"; exit 1; }
          if grep -aqr "LLAMA_LLGUIDANCE=ON) is not enabled" build/bin; then echo "::error::built without llguidance"; exit 1; fi
      - name: Pack
        run: |
          T=${{ env.ANDROID_TAG }}
          cp LICENSE ./build/bin/
          tar -czf llama-$T-bin-android-arm64.tar.gz --transform "s,^\.,llama-$T," -C ./build/bin .
      - uses: actions/upload-artifact@v5
        with:
          name: android-arm64
          path: llama-*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/runtime-')
    needs: [linux-x64, macos-arm64, windows-x64, android-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Model runtime ${GITHUB_REF_NAME}" \
            --notes "llama.cpp ${DESKTOP_TAG} (desktops) and ${ANDROID_TAG} (Android), rebuilt with llguidance (-DLLAMA_LLGUIDANCE=ON) and otherwise upstream's own flags. File names and layout are upstream's. Vulkan archives add upstream's unchanged Vulkan backend from the same tag. See docs/context/decisions.md in this repository."
