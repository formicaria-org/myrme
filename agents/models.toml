repo = "unsloth/Qwen3-4B-Instruct-2507-GGUF"
file = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
revision = "a06e946bb6b655725eafa393f4a9745d460374c9"
sha256 = "3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597"
note = "LAPTOP fallback (was the pick to 2026-07-24) — IFEval 83.4 / BFCL-v3 61.9; ~2.4 GB, 39.8 t/s GPU. Validated + fine; superseded by qwen3-vl-4b which grounds better at the same speed. Non-thinking Instruct."

[[models]]
name = "lfm2.5-1.2b"
repo = "LiquidAI/LFM2.5-1.2B-Instruct-GGUF"
file = "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
revision = "6767265158422fb8a19c62ceb45f16f05363615b"
sha256 = "b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5"
note = "PHONE pick — IFEval 86.2 / BFCL-v3 49.1, top of its size tier; measured 15.9 tok/s, ~1.4 GB resident on the Dimensity 7300. Runs smoothly at 4 threads without blocking the UI."

[[models]]
name = "ggml-base.en"
