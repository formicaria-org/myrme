# The agent's local model catalogue and runtime — the single place that says *which* model to fetch
# and run. `fetch.sh` (or `pixi run fetch-model [name]`) reads this, downloads the runtime and the
# chosen model into the gitignored `runtime/` and `models/` folders beside this file, and prints how
# to serve it. Nothing here is huge, secret, or committed: only this manifest travels; the weights
# and the binary stay local. The mobile app embeds this file (include_str!) for its first run.
#
# Design stance (owner, 2026-07-22): **one measured pick per device, nothing else.** Chosen by real
# on-device benchmarks (docs/context/model-benchmarks-2026-07-22.md) and leaderboard evidence
# (docs/context/model-selection-research-2026-07-22.md), weighted for instruction-following +
# tool/search use (BFCL × IFEval), explicitly not code. The two devices differ, so the defaults differ.

# The default model — the LAPTOP research pick. `default_mobile` overrides it on the phone (a smaller
# model that fits a phone's RAM and stays responsive).
default = "qwen3-4b-2507"
default_mobile = "lfm2.5-1.2b"

# Prebuilt llama.cpp server, pinned for reproducibility. `runtime_url` is the portable CPU build;
# `runtime_url_gpu` is the Vulkan build that offloads to a discrete GPU (measured: the RTX 3050 runs the
# 4B at ~52 tok/s vs ~14 on CPU, and holds it in VRAM instead of system RAM). fetch.sh picks the GPU
# build when `gpu` != "off" and a Vulkan loader is present — GPU speed with no config, CPU otherwise.
runtime_url = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-ubuntu-x64.tar.gz"
runtime_url_gpu = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-ubuntu-vulkan-x64.tar.gz"

# Serve settings. `threads` is the laptop value (8 physical cores); `threads_mobile` is the phone's —
# 4 = the Dimensity 7300's big cores, which is *both* fastest and leaves the little cores for the UI
# (measured). Small `ctx` bounds the KV cache. Each [[models]] block may override `ctx`/`threads`.
port = 8081
ctx = 2048
threads = 8
threads_mobile = 4
# The longest reply the agent posts, in characters (a "never berserk" bound + keeps a small model
# concise). Raise it here for longer answers — a formula + explanation needs more than the old 600.
max_reply_chars = 2000

# GPU policy for the desktop runtime: "auto" (use the best GPU when one is present, else CPU), "on"
# (always offload), or "off" (CPU only). Default is GPU-when-available.
gpu = "auto"

# Each model: `name` (the key you pass to fetch), its Hugging Face `repo` and `file`, and a note.
# Keep `name`, then `repo`, then `file` in that order — fetch.sh reads them positionally.

[[models]]
name = "qwen3-4b-2507"
repo = "unsloth/Qwen3-4B-Instruct-2507-GGUF"
file = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
note = "LAPTOP pick — IFEval 83.4 / BFCL-v3 61.9 (best small-model tool-calling); ~2.4 GB, ~14 tok/s on the i7 CPU, fits the RTX 3050 4 GB for a future CUDA build. Non-thinking Instruct (not -Thinking, not -Coder)."

[[models]]
name = "lfm2.5-1.2b"
repo = "LiquidAI/LFM2.5-1.2B-Instruct-GGUF"
file = "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
note = "PHONE pick — IFEval 86.2 / BFCL-v3 49.1, top of its size tier; measured 15.9 tok/s, ~1.4 GB resident on the Dimensity 7300. Runs smoothly at 4 threads without blocking the UI."
