# The agent's local model catalogue and runtime — the single place that says *which* model to fetch
# and run. `fetch.sh` (or `pixi run fetch-model [name]`) reads this, downloads the runtime and the
# chosen model into the gitignored `runtime/` and `models/` folders beside this file, and prints how
# to serve it. Nothing here is huge, secret, or committed: only this manifest travels; the weights
# and the binary stay local. The mobile app embeds this file (include_str!) for its first run.
#
# Design stance (owner, 2026-07-22): **one measured pick per device, nothing else.** Chosen by real
# on-device benchmarks and leaderboard evidence, weighted for instruction-following + tool/search use
# (BFCL × IFEval), explicitly not code. The two devices differ, so the defaults differ.
#
# LAPTOP pick updated 2026-07-24 → **qwen3-vl-4b**, from a hardened-harness sweep of the alternatives
# (docs/context/model-selection-research-2026-07-24-grounded.md § Part 5; raw in agents/bench/results.md):
# same GPU speed as qwen3-4b (40.1 t/s), *best-measured* grounding (3/3 verbatim), and the only fast
# model that abstains on junk sources instead of fabricating. Text-only here (mmproj not fetched); the
# multimodal head is enabled by fetching `mmproj` (below), which `/describe` needs and nothing else
# uses. qwen3-4b-2507 kept below as the validated fallback.
# PHONE pick unchanged: the same sweep found no ≤2B model beats lfm2.5-1.2b (nothing grounds below 4B).

# The default model — the LAPTOP research pick. `default_mobile` overrides it on the phone (a smaller
# model that fits a phone's RAM and stays responsive).
default = "qwen3-vl-4b"
default_mobile = "lfm2.5-vl-450m"

# Prebuilt llama.cpp server, pinned for reproducibility. `runtime_url_<platform>` is the portable
# CPU build; the `_gpu` variant is the Vulkan build that offloads to a discrete GPU (measured: the RTX 3050 runs the
# 4B at ~52 tok/s vs ~14 on CPU, and holds it in VRAM instead of system RAM). fetch.sh picks the GPU
# build when `gpu` != "off" and a Vulkan loader is present — GPU speed with no config, CPU otherwise.
# **Keyed by platform, and every archive carries its checksum.** A model is pinned by a Hugging
# Face commit *and* a hash; a runtime is a URL to an executable, so the hash is the only thing
# between a redirect and running a stranger's binary — `Manifest::parse` therefore drops any
# `runtime_url_*` whose `runtime_sha256_*` is missing rather than fetching it unverified.
#
# The suffix is the platform: `linux_x64`, `macos_arm64`, `windows_x64`, with `_gpu` for the Vulkan
# build that offloads to a discrete GPU. Every archive here was downloaded and hashed; a platform we
# have not verified gets no entry at all rather than one the fetch cannot check.
runtime_url_linux_x64 = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-ubuntu-x64.tar.gz"
runtime_sha256_linux_x64 = "25d2df529ce393ab994ff5f2ae8511ec729c0591e69c497203b9b7715798c811"
runtime_url_linux_x64_gpu = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-ubuntu-vulkan-x64.tar.gz"
runtime_sha256_linux_x64_gpu = "eed61f88431cc826d36c99fcac00122039e254512a8c0c3cd54ee18f6eab2ed5"
# macOS ships a tarball like Linux; Windows ships a `.zip`, which is why the extractor learned a
# second format. Both hashed from the downloaded archive, like the Linux pair above.
runtime_url_macos_arm64 = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-macos-arm64.tar.gz"
runtime_sha256_macos_arm64 = "0e4bbc887343e7facad515d1142387d3d7dc3f0d9dad7c7cc5b3b503ed8189e1"
runtime_url_windows_x64 = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-win-cpu-x64.zip"
runtime_sha256_windows_x64 = "73478535f9f67a80a6f4f15187295b0ee8734c340a7e5aba82674bc8cdeacf9c"
runtime_url_windows_x64_gpu = "https://github.com/ggml-org/llama.cpp/releases/download/b10076/llama-b10076-bin-win-vulkan-x64.zip"
runtime_sha256_windows_x64_gpu = "6b3f3450c4fe89e079194f412eb5dc4b8bc2b9e371454c416e6095b6127153bb"

# Serve settings. `threads` is the laptop value (8 physical cores); `threads_mobile` is the phone's —
# 4 = the Dimensity 7300's big cores, which is *both* fastest and leaves the little cores for the UI
# (measured). Small `ctx` bounds the KV cache. Each [[models]] block may override `ctx`/`threads`.
port = 8081
ctx = 2048
threads = 8
threads_mobile = 4
# The longest reply the agent posts, in characters (a "never berserk" bound + keeps a small model
# concise). Raise it here for longer answers — a formula + explanation needs more than the old 600.
max_reply_chars = 2000

# GPU policy for the desktop runtime: "auto" (use the best GPU when one is present, else CPU), "on"
# (always offload), or "off" (CPU only). Default is GPU-when-available.
gpu = "auto"

# --- Audio→transcript runtime (whisper.cpp). ---------------------------------------------------------
# Used by `agent-serve --whisper-port <p>` (enables audio in the /transcribe command). The transcript
# rides the same insertion-only proposal path as /research; the specialist only ever receives audio
# bytes by value, never a blob path (the transcribe safety invariant). The runtime and the weights
# are fetched when Audio transcription is switched on (Linux and Windows; see the `runtime_url_whisper_*`
# keys below), or by `pixi run fetch-whisper` in a checkout. `agent-serve` errors clearly if either is
# missing, so nothing silently half-works.
whisper_model = "ggml-base.en"
whisper_model_repo = "ggerganov/whisper.cpp"
whisper_model_file = "ggml-base.en.bin"
# The PHONE whisper pick — a `[[models]]` name (below) fetched on demand by the mobile app when Audio
# transcription is on. Moved tiny.en → base.en (2026-07-24): base is ~148 MB (vs tiny ~75 MB), still
# tiny beside the 1.4 GB llama, and it matches the desktop for materially better accuracy on real
# speech. The admission gate (model file + 300 MB headroom ≈ 450 MB) fits with room to spare on the
# 7.4 GB phone. tiny.en stays defined below as the fall-back if RAM ever gets tight.
whisper_mobile = "ggml-base.en"
# whisper.cpp DOES ship a prebuilt, CPU-only, portable Linux x64 server tarball (verified: it unpacks
# `whisper-server` + `libwhisper.so` + `libggml-cpu-*` micro-arch variants, ~24 MB, no CUDA, links only
# stock system libs). So `fetch-whisper` stages it automatically, exactly like the llama.cpp runtime —
# no build-from-source. (The tarball also bundles a `parakeet-cli`, a possible future faster/edge leaf.)
runtime_url_whisper_linux_x64 = "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-ubuntu-x64.tar.gz"
runtime_sha256_whisper_linux_x64 = "f3bf3b4369a99b54665b0f19b88483b30de27f25963b0414235dea03198515c5"
# Windows ships a `.zip` holding `Release/whisper-server.exe` and its DLLs — flattened on extraction
# like every other runtime here. **There is no macOS build upstream at v1.9.1**, which is why macOS
# has no entry: the app then says the runtime does not exist for that platform yet, rather than
# implying something is missing from the machine. Unlike the llama archives this one carries no
# LICENSE file, so whisper.cpp's MIT notice travels via `ci/third-party.sh`'s runtime section only.
runtime_url_whisper_windows_x64 = "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.1/whisper-bin-x64.zip"
runtime_sha256_whisper_windows_x64 = "7d8be46ecd31828e1eb7a2ecdd0d6b314feafd82163038ab6092594b0a063539"

# Each model: `name` (the key you pass to fetch), its Hugging Face `repo` and `file`, and a note.
# Keep `name`, then `repo`, then `file` in that order — fetch.sh reads them positionally.
#
# `revision` + `sha256` (2026-08-29): the exact Hugging Face commit, and the SHA-256 of the file at
# that commit. **They only work as a pair.** A checksum against `resolve/main` is a moving target: the
# day a repo re-quantises, every download starts failing verification — permanently, on every device
# already shipped, with nothing the user can do. Pinned to a commit, the URL names the same bytes
# forever, so a mismatch can only mean a corrupt transfer, which is what a checksum is for.
#
# Until these existed the downloader's verification branches were dead code, and a body that closed
# early was renamed as complete and returned forever — the only self-heal was uninstalling the app,
# which also destroys the vault.
#
# Provenance: taken from the Hugging Face API (`?blobs=true` → `siblings[].lfs.sha256`), and the three
# files present in this checkout were re-hashed locally and match — so these pin the bytes that were
# actually benchmarked, not a number taken on trust.

# `license` and `bytes` are here because the app has to *show* them before it spends someone's
# disk and bandwidth: the first-enable screen names what it is about to download, how large it is,
# and under what terms. Both were previously prose inside `note`, which no parser can read.
# `bytes` is the download size (the local file, re-hashed above); `mmproj_bytes` is the extra
# projector that makes image-reading work, charged separately because it is a separate choice.
[[models]]
name = "qwen3-vl-4b"
license = "Apache-2.0"
bytes = 2497281664
mmproj_bytes = 836180256
repo = "Qwen/Qwen3-VL-4B-Instruct-GGUF"
file = "Qwen3VL-4B-Instruct-Q4_K_M.gguf"
revision = "1cd86afb9a95c410a6038ab3b40d8b578c892266"
sha256 = "66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a"
# The multimodal projector — what turns this from a text model into the vision model it already is.
# Optional and additive: without it the same GGUF serves text-only, exactly as it has until now, and
# `/describe` says so instead of describing an image it never saw. Fetched beside the weights from
# the same pinned commit. Apache-2.0, like the model.
mmproj = "mmproj-Qwen3VL-4B-Instruct-F16.gguf"
# **8192, and the projector off the GPU — the two go together** (measured 2026-10-09 on the 4 GB RTX
# 3050). With the projector on the card, nothing above 2048 starts (out of device memory). Off the
# card, 8192 starts at 3626 MiB and answered a 6.8k-token email exchange in 14.5 s at 3641 MiB. Why
# 8192: the meeting pass reads a whole email conversation in one prompt, and 2048 holds ~700 words.
# Cost on a machine with no GPU: ~0.9 GB more RAM for the larger KV cache.
ctx = 8192
mmproj_offload = false
note = "LAPTOP pick (2026-07-24) — measured on our case: 40.1 t/s on the RTX 3050 (Vulkan, 2.78 GB VRAM), 3/3 verbatim grounding (best of the sweep), abstains on junk sources. Served text-only via /v1/chat/completions (mmproj-Qwen3VL-4B-Instruct-F16.gguf only needed if we later add image-notes). Caveat: less eager to *initiate* a search — fine while /research is deterministically routed. Apache-2.0."

[[models]]
name = "qwen3-4b-2507"
license = "Apache-2.0"
bytes = 2497281120
repo = "unsloth/Qwen3-4B-Instruct-2507-GGUF"
file = "Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
revision = "a06e946bb6b655725eafa393f4a9745d460374c9"
sha256 = "3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597"
note = "LAPTOP fallback (was the pick to 2026-07-24) — IFEval 83.4 / BFCL-v3 61.9; ~2.4 GB, 39.8 t/s GPU. Validated + fine; superseded by qwen3-vl-4b which grounds better at the same speed. Non-thinking Instruct."

[[models]]
name = "lfm2.5-vl-450m"
license = "LFM Open License v1.0"
bytes = 379219104
repo = "LiquidAI/LFM2.5-VL-450M-GGUF"
file = "LFM2.5-VL-450M-Q8_0.gguf"
revision = "1abed04b6fe71314d8c446a1371c03d7c332266d"
sha256 = "263aca93039e22140d55e046831c700c796affa8143d7638581c488a30c712bc"
mmproj = "mmproj-LFM2.5-VL-450m-F16.gguf"
mmproj_bytes = 189126080
# A large photo is cut into up to ~1027 image tokens (measured), so the phone's global 2048 window
# would leave too little room for the answer. 4096 is what the phone measurement ran at.
ctx = 4096
# Its own reading instruction: the house one took it from 1.00 to 0.63 on plain typed notes.
read_prompt = "Transcribe the text in this image exactly."
note = "PHONE pick since 2026-10-10 (owner's choice: one general model that can also see). Measured on the Dimensity 7300: an image read in 3-5 s (about 10 s for a full-size photo), 1.2 GB peak, text at ~25 tok/s. Correct on typed notes and tables; misread one formula and flattened one code block's nesting. NOT yet measured as a chat model against lfm2.5-1.2b, which it replaces and which is more than twice its size."

[[models]]
name = "lfm2.5-1.2b"
license = "LFM Open License v1.0"
# The DOWNLOAD size, measured from the server. The note below says ~1.4 GB, which is what it
# occupies in memory when running — a different number, and the wrong one to show someone who is
# about to spend bandwidth on it.
bytes = 730895168
repo = "LiquidAI/LFM2.5-1.2B-Instruct-GGUF"
file = "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
revision = "6767265158422fb8a19c62ceb45f16f05363615b"
sha256 = "b1b3de114215d9507409a662a501a631095a479a419584e8a2ded6304b19b4f5"
note = "PHONE pick until 2026-10-10, kept as the text-only fallback — IFEval 86.2 / BFCL-v3 49.1, top of its size tier; measured 15.9 tok/s, ~1.4 GB resident on the Dimensity 7300. Runs smoothly at 4 threads without blocking the UI."

